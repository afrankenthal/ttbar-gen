# All-hadronic ttbar at NLO, for reproducing the HyPER benchmark sample.
#
# This is MadLAD's processes/ttbar-allhad.yaml (commit 4b0983c) with three changes:
#   1. reweight_scale / reweight_PDF switched off. They only add weights to each
#      event (scale variations and 100 PDF members); the events themselves are
#      unchanged, and generation is faster and the HepMC files smaller.
#   2. block_delphes removed. The job script runs Delphes itself, streaming the
#      HepMC file and using a card with a slimmed output tree.
#   3. nevents / iseed are placeholders; the job script sets them per task.
# Everything else (model, process, PDF, scales, MadSpin decays) is MadLAD's.
run:
  image:       "madlad-hyper"
  mg5:         "/app/MG5_aMC/bin/mg5_aMC"
  launch-from: null
  auto-launch: False
  shower:      True

gen:
  block_settings:
    run_mode:       2
    nb_core:        4

  block_model:
    model:          loop_sm-no_b_mass
    multiparticle:  ["p = g u c d s u~ c~ d~ s~ b b~", "j = g u c d s u~ c~ d~ s~ b b~"]
    proc:           "p p > t t~ [QCD]"
    order:          "nlo"
    save_dir:       "ttbar_allhad"

  block_run:
    nevents:        1000
    nevt_job:       1000
    iseed:          0
    beamenergy:     6500
    pdlabel:        "lhapdf"
    lhaid:          260000
    parton_shower:  "PYTHIA8"
    maxjetflavor:   5
    reweight_scale: ".false."
    reweight_PDF:   ".false."
    muR_over_ref:   1.0
    muF1_over_ref:  1.0
    muF2_over_ref:  1.0
    dynamical_scale_choice: 10
    jetalgo:        -1
    jetradius:      0.4
    ptj:            0.1
    req_acc:        0.001

  block_madspin:
    multiparticle:  ["p = g u c d s u~ c~ d~ s~ b b~", "j = g u c d s u~ c~ d~ s~ b b~"]
    decays:         ["t > w+ b, w+ > j j", "t~ > w- b~, w- > j j"]
    bwcut:          15
    max_weight_ps_point: 500
    Nevents_for_max_weight: 500

  block_param:
    param: "aMcAtNlo_param_card_loop_sm-no_b_mass.dat"

  block_sf:
    custom_scales: [
        "c         Q^2= mt^2 + 0.5*(pt^2+ptbar^2)",
        "          xm2=dot(pp(0,3),pp(0,3))",
        "          tmp=sqrt(xm2+0.5*(pt(pp(0,3))**2+pt(pp(0,4))**2))",
        "          temp_scale_id='mt**2 + 0.5*(pt**2+ptbar**2)'",
        "              "
    ]

post: [
  "echo 'Finished'"
]
