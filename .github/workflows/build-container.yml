name: build-container

# Builds container/Dockerfile and pushes it to the GitHub container registry as
#   ghcr.io/<owner>/madlad-hyper:latest
# Runs when the Dockerfile changes, or by hand from the Actions tab.
on:
  workflow_dispatch:
  push:
    paths:
      - container/Dockerfile
      - .github/workflows/build-container.yml

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Lower-case the owner name (registry paths must be lower case)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: container
          file: container/Dockerfile
          push: true
          tags: ghcr.io/${{ env.OWNER }}/madlad-hyper:latest
